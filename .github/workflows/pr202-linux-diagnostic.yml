name: PR 202 Linux Bun diagnostic

on:
  push:
    branches:
      - diagnostics/linux-bun-pr202-sep22

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the exact upstream CI merge
        uses: actions/checkout@v4
        with:
          repository: tscircuit/circuit-json-to-gltf
          ref: 1c7eebe47305e35a4219f6ca6daa9373a9db8ebe
          persist-credentials: false

      - name: Setup Bun matching upstream CI
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Record source and runtime
        run: |
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
          bun --revision
          uname -a
          lscpu

      - name: Install dependencies as upstream CI does
        run: bun install

      - name: Run the complete upstream test command
        run: bun test

      - name: Record resolved dependencies
        if: always()
        run: bun pm ls --all
